name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease -Pvc=$((100 + ${{ github.run_number }})) --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk KhmerKreung-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KhmerKreung-${{ github.run_number }}
          path: KhmerKreung-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khmer Kreung build ${{ github.run_number }}
          body: Download KhmerKreung-${{ github.run_number }}.apk below and install it. It updates the previous version and keeps your data.
          files: KhmerKreung-${{ github.run_number }}.apk
          make_latest: true
